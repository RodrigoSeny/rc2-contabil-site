# RC2 Contábil — site público (contabil.rc2sistemas.cloud)
# Estático, servido direto pelo Nginx: não depende de nenhum sistema (PM2).
#
# Instalação (na VPS):
#   sudo cp /var/www/rc2-contabil-site/deploy/nginx-contabil.conf /etc/nginx/sites-available/rc2-contabil
#   sudo ln -s /etc/nginx/sites-available/rc2-contabil /etc/nginx/sites-enabled/rc2-contabil
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d contabil.rc2sistemas.cloud --redirect

# Log de acesso com IP anonimizado (último bloco zerado) já na gravação —
# base para estatística de visitas sem guardar dado pessoal.
map $remote_addr $rc2c_ip_anon {
    ~^(?P<ip4>\d+\.\d+\.\d+)\.\d+$          $ip4.0;
    ~^(?P<ip6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $ip6::;
    default                                  0.0.0.0;
}
log_format rc2c_anon '$rc2c_ip_anon - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name contabil.rc2sistemas.cloud;

    root /var/www/rc2-contabil-site/public;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    access_log /var/log/nginx/rc2-contabil.access.log rc2c_anon;
    error_log  /var/log/nginx/rc2-contabil.error.log warn;

    # Site estático: só leitura
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Cabeçalhos de segurança (valem para todas as locations abaixo, que não
    # usam add_header próprio — em Nginx, add_header numa location anula os do server).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://brasilapi.com.br https://publica.cnpj.ws; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Ative depois de confirmar o HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Enquanto não houver página inicial da RC2 Contábil, a raiz leva à calculadora.
    location = /            { return 302 /calculadora-simples/; }
    location = /calculadora { return 301 /calculadora-simples/; }

    location ~ /\.          { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML sempre revalidado (atualizações chegam na hora); assets com cache.
    location ~* \.html$ {
        expires -1;
    }
    location ~* \.(css|js|png|ico|svg|webp)$ {
        expires 7d;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
